<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Меню</title>
</head>
<body>
    <div class="main">
        <div class="menu-header">
            <h1>Система мониторинга ТСД</h1>
            <p>Центральный пульт управления терминалами сбора данных</p>
            <button class="exit" id="exit">Выйти из системы</button> 
        </div>

        <div class="grid">
            <div class="menu-card">
                <h2>Панель состояния ТСД</h2>
                <button class="open" id="status-btn">Открыть</button>
            </div>
            
            <div class="menu-card">
                <h2>Геолокация</h2>
                <button class="open" id="geo-btn">Открыть</button>
            </div>

            <div class="menu-card">
                <h2>Журнал приема-передачи</h2>
                <button class="open" id="journal-btn">Открыть</button>
            </div>

            <div class="menu-card">
                <h2>Архив</h2>
                <button class="open" id="archive-btn">Открыть</button>
            </div>
        </div>
        <!-- <footer>ООО Производственная компания</footer>  -->
    </div>

    
    <script src="app.js"></script>

</body>
</html>
